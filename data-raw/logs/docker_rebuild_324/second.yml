# Memory for the #324 rebuild instance, run beside a live fresh-db on the same
# machine (tuning.md's 32 GB preset). Replaces the base `command:` list.
# Sized for the loader alone, one session: shm_size 12gb is under what two
# concurrent parallel hash joins at work_mem=1GB can need; raise
# shm_size or lower work_mem before running a pipeline against it.
services:
  db:
    shm_size: 12gb
    command: >
      postgres
        -c default_statistics_target=100
        -c max_connections=40
        -c max_locks_per_transaction=64
        -c checkpoint_timeout=30min
        -c maintenance_work_mem=2GB
        -c effective_cache_size=24GB
        -c work_mem=1GB
        -c max_wal_size=10GB
        -c wal_buffers=64MB
        -c shared_buffers=8GB
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=6
        -c max_worker_processes=8
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c temp_buffers=64MB
