# Regenerate CITATION.cff from DESCRIPTION when DESCRIPTION changes on main.
#
# The job is New Graph Environment's shared workflow, so a runner, a timeout or a step
# changes in one place: https://github.com/NewGraphEnvironment/flows
on:
  push:
    branches: [main]
    paths:
      - 'DESCRIPTION'
  workflow_dispatch:

name: Update CITATION.cff

permissions:
  contents: write

jobs:
  update-citation:
    uses: NewGraphEnvironment/flows/.github/workflows/r-citation-cff.yaml@v1
