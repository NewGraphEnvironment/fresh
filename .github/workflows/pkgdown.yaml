# Build the pkgdown site, and deploy it from main.
#
# The job is New Graph Environment's shared workflow, so a runner, a timeout or a step
# changes in one place: https://github.com/NewGraphEnvironment/flows
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    permissions:
      contents: write
    uses: NewGraphEnvironment/flows/.github/workflows/r-pkgdown.yaml@v1
