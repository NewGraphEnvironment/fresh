# Local fwapg instance for fresh habitat pipeline
#
# Usage:
#   cd docker
#   docker compose up -d db                   # start PostGIS
#   docker compose run --rm loader            # load fwapg data + falls
#   docker compose run --rm loader --bcfishobs  # optional: load fish observations
#   docker compose down                       # stop
#   docker compose down -v                    # stop + delete data
#
# Connect from R:
#   conn <- DBI::dbConnect(RPostgres::Postgres(),
#     host = "localhost", port = 5432,
#     dbname = "fwapg", user = "postgres", password = "postgres")
#
# A second instance beside the first (README, "A second instance"): give it its
# own project name, files, container names, port and data directory, e.g.
#   COMPOSE_PROJECT_NAME=fresh-2 COMPOSE_FILE=docker-compose.yml \
#   FRESH_DB_IMAGE=imresamu/postgis:17-3.6.1-trixie \
#   FRESH_DB_CONTAINER=fresh-db-2 FRESH_DB_PORT=5433 \
#   FRESH_DB_DATA=./postgres-data-2 docker compose up -d db
#
# Image: PostgreSQL 17, PostGIS 3.6, GEOS 3.13 on Debian trixie. Up to 2026-11
# this was 17-3.5-bullseye (PostGIS 3.5.2, GEOS 3.9.0), whose GEOS returns an
# empty intersection for an exactly vertical line inside a box and, on arm64, simplifies a
# polygon differently from one call to the next (#324). A routine `up` over
# a data directory built on the old image would start this one on it, and it
# must not: the newer glibc changes the collation version (text indexes need a
# REINDEX) and the postgis extension needs an UPDATE (#335). Every machine
# holding a data directory built on the old image keeps it there, before its
# next `up`, with FRESH_DB_IMAGE=imresamu/postgis:17-3.5-bullseye in a
# docker/.env beside this file (gitignored), until it moves. A .env here is read
# by every project using this file, so a second instance on the new image
# exports FRESH_DB_IMAGE; and it names its files (COMPOSE_FILE), because with
# none Compose also merges a host's docker-compose.override.yml, which can name
# the first instance's volume (README).

services:
  db:
    image: ${FRESH_DB_IMAGE:-imresamu/postgis:17-3.6.1-trixie}
    container_name: ${FRESH_DB_CONTAINER:-fresh-db}
    shm_size: 36gb
    command: >
      postgres
        -c default_statistics_target=100
        -c max_connections=40
        -c max_locks_per_transaction=64
        -c checkpoint_timeout=30min
        -c maintenance_work_mem=4GB
        -c effective_cache_size=96GB
        -c work_mem=2GB
        -c max_wal_size=10GB
        -c wal_buffers=64MB
        -c shared_buffers=32GB
        -c max_parallel_workers_per_gather=8
        -c max_parallel_workers=14
        -c max_worker_processes=16
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c temp_buffers=64MB
    volumes:
      - ${FRESH_DB_DATA:-./postgres-data}:/var/lib/postgresql/data
    ports:
      - "${FRESH_DB_PORT:-5432}:5432"
    healthcheck:
      # Over TCP, not the socket: on an empty data directory the image's init
      # runs a temporary server on the Unix socket only (creating extensions,
      # which can take minutes), and a socket check calls that healthy, so the
      # loader started and got "Connection refused" (#324).
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 1s
      retries: 5
      start_period: 15m
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fwapg

  loader:
    build:
      context: .
    container_name: ${FRESH_LOADER_CONTAINER:-fresh-loader}
    volumes:
      - "${FWAPG_DIR:-../../fwapg}:/home/fwapg:ro"
      - "${BCFISHOBS_DIR:-../../bcfishobs}:/home/bcfishobs:ro"
      - "../inst/extdata:/home/fresh/extdata:ro"
      - "./load.sh:/home/fresh/load.sh:ro"
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fwapg
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/home/fresh/load.sh"]
