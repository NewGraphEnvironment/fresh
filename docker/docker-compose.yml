# Local fwapg instance for fresh habitat pipeline
#
# Usage:
#   cd docker
#   docker compose up -d db                   # start PostGIS
#   docker compose run --rm loader            # load fwapg data + falls
#   docker compose run --rm loader --bcfishobs  # optional: load fish observations
#   docker compose down                       # stop
#   docker compose down -v                    # stop + delete data
#
# Connect from R:
#   conn <- DBI::dbConnect(RPostgres::Postgres(),
#     host = "localhost", port = 5432,
#     dbname = "fwapg", user = "postgres", password = "postgres")
#
# A second instance beside the first (README, "A second instance"): give it its
# own project name, container names, port and data directory, e.g.
#   FRESH_DB_CONTAINER=fresh-db-2 FRESH_LOADER_CONTAINER=fresh-loader-2 \
#   FRESH_DB_PORT=5433 FRESH_DB_DATA=./postgres-data-2 \
#   docker compose -p fresh-2 up -d db
#
# Image: PostGIS 3.5 on Debian bookworm (GEOS 3.11), as upstream fwapg's own
# db image. Up to 2026-11 this was 17-3.5-bullseye (GEOS 3.9.0). The data
# directory format is the same (PostgreSQL 17), so `docker compose up -d db`
# over an existing bullseye directory starts on it, but answers change:
# GEOS 3.9.0's wrong line-polygon intersections and repeat-varying polygon
# simplification go away, and the newer glibc changes the collation version,
# so text indexes need a REINDEX. Moving an existing database is a step of its
# own; do not let a routine `up` make it.

services:
  db:
    image: imresamu/postgis:17-3.5.3-bookworm
    container_name: ${FRESH_DB_CONTAINER:-fresh-db}
    shm_size: 36gb
    command: >
      postgres
        -c default_statistics_target=100
        -c max_connections=40
        -c max_locks_per_transaction=64
        -c checkpoint_timeout=30min
        -c maintenance_work_mem=4GB
        -c effective_cache_size=96GB
        -c work_mem=2GB
        -c max_wal_size=10GB
        -c wal_buffers=64MB
        -c shared_buffers=32GB
        -c max_parallel_workers_per_gather=8
        -c max_parallel_workers=14
        -c max_worker_processes=16
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c temp_buffers=64MB
    volumes:
      - ${FRESH_DB_DATA:-./postgres-data}:/var/lib/postgresql/data
    ports:
      - "${FRESH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 1s
      retries: 5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fwapg

  loader:
    build:
      context: .
    container_name: ${FRESH_LOADER_CONTAINER:-fresh-loader}
    volumes:
      - "${FWAPG_DIR:-../../fwapg}:/home/fwapg:ro"
      - "${BCFISHOBS_DIR:-../../bcfishobs}:/home/bcfishobs:ro"
      - "../inst/extdata:/home/fresh/extdata:ro"
      - "./load.sh:/home/fresh/load.sh:ro"
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fwapg
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/home/fresh/load.sh"]
